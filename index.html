<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournament Bracket</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#070b14] text-slate-100 min-h-screen p-6 font-sans flex flex-col justify-center items-center">

  <div class="w-full max-w-[1400px] bg-[#0b1120] border border-slate-800/80 rounded-2xl p-8 shadow-2xl overflow-x-auto">
    
    <!-- Header -->
    <div class="flex justify-between items-center mb-10 pb-4 border-b border-slate-800/50">
      <div class="grid grid-cols-4 w-full max-w-3xl text-xs font-black tracking-widest text-blue-400 uppercase">
        <div>Round of 16</div>
        <div class="text-center">Quarterfinals</div>
        <div class="text-center">Semifinals</div>
        <div class="text-center">Finals</div>
      </div>
      <div class="text-right">
        <h1 class="text-2xl font-black tracking-wider text-slate-100 uppercase leading-none">
          TOURNAMENT <span class="text-emerald-400">BRACKET</span>
        </h1>
      </div>
    </div>

    <!-- Bracket Grid -->
    <div class="flex items-center justify-between min-w-[1100px] gap-6">
      
      <!-- ROUND OF 16 (8 Matches) -->
      <div class="flex flex-col gap-3 w-48">
        <!-- Match 1 -->
        <div class="bg-[#131b2e] border border-slate-700/50 rounded-lg p-1.5 shadow-md">
          <div id="p1" class="bg-[#1a243b] px-3 py-1.5 rounded text-xs font-bold text-slate-200 uppercase truncate">PLAYER1</div>
          <div id="p2" class="bg-[#1a243b] px-3 py-1.5 rounded text-xs font-bold text-slate-200 uppercase truncate mt-1">PLAYER2</div>
        </div>
        <!-- Match 2 -->
        <div class="bg-[#131b2e] border border-slate-700/50 rounded-lg p-1.5 shadow-md">
          <div id="p3" class="bg-[#1a243b] px-3 py-1.5 rounded text-xs font-bold text-slate-200 uppercase truncate">PLAYER3</div>
          <div id="p4" class="bg-[#1a243b] px-3 py-1.5 rounded text-xs font-bold text-slate-200 uppercase truncate mt-1">PLAYER4</div>
        </div>
        <!-- Match 3 -->
        <div class="bg-[#131b2e] border border-slate-700/50 rounded-lg p-1.5 shadow-md">
          <div id="p5" class="bg-[#1a243b] px-3 py-1.5 rounded text-xs font-bold text-slate-200 uppercase truncate">PLAYER5</div>
          <div id="p6" class="bg-[#1a243b] px-3 py-1.5 rounded text-xs font-bold text-slate-200 uppercase truncate mt-1">PLAYER6</div>
        </div>
        <!-- Match 4 -->
        <div class="bg-[#131b2e] border border-slate-700/50 rounded-lg p-1.5 shadow-md">
          <div id="p7" class="bg-[#1a243b] px-3 py-1.5 rounded text-xs font-bold text-slate-200 uppercase truncate">PLAYER7</div>
          <div id="p8" class="bg-[#1a243b] px-3 py-1.5 rounded text-xs font-bold text-slate-200 uppercase truncate mt-1">PLAYER8</div>
        </div>
        <!-- Match 5 -->
        <div class="bg-[#131b2e] border border-slate-700/50 rounded-lg p-1.5 shadow-md">
          <div id="p9" class="bg-[#1a243b] px-3 py-1.5 rounded text-xs font-bold text-slate-200 uppercase truncate">PLAYER9</div>
          <div id="p10" class="bg-[#1a243b] px-3 py-1.5 rounded text-xs font-bold text-slate-200 uppercase truncate mt-1">PLAYER10</div>
        </div>
        <!-- Match 6 -->
        <div class="bg-[#131b2e] border border-slate-700/50 rounded-lg p-1.5 shadow-md">
          <div id="p11" class="bg-[#1a243b] px-3 py-1.5 rounded text-xs font-bold text-slate-200 uppercase truncate">PLAYER11</div>
          <div id="p12" class="bg-[#1a243b] px-3 py-1.5 rounded text-xs font-bold text-slate-200 uppercase truncate mt-1">PLAYER12</div>
        </div>
        <!-- Match 7 -->
        <div class="bg-[#131b2e] border border-slate-700/50 rounded-lg p-1.5 shadow-md">
          <div id="p13" class="bg-[#1a243b] px-3 py-1.5 rounded text-xs font-bold text-slate-200 uppercase truncate">PLAYER13</div>
          <div id="p14" class="bg-[#1a243b] px-3 py-1.5 rounded text-xs font-bold text-slate-200 uppercase truncate mt-1">PLAYER14</div>
        </div>
        <!-- Match 8 -->
        <div class="bg-[#131b2e] border border-slate-700/50 rounded-lg p-1.5 shadow-md">
          <div id="p15" class="bg-[#1a243b] px-3 py-1.5 rounded text-xs font-bold text-slate-200 uppercase truncate">PLAYER15</div>
          <div id="p16" class="bg-[#1a243b] px-3 py-1.5 rounded text-xs font-bold text-slate-200 uppercase truncate mt-1">PLAYER16</div>
        </div>
      </div>

      <!-- QUARTERFINALS (4 Matches) -->
      <div class="flex flex-col justify-around h-[680px] w-48">
        <div class="bg-[#131b2e] border border-slate-700/50 rounded-lg p-1.5 shadow-md">
          <div id="q1" class="bg-[#1a243b] px-3 py-1.5 rounded text-xs font-bold text-slate-200 uppercase truncate">???</div>
          <div id="q2" class="bg-[#1a243b] px-3 py-1.5 rounded text-xs font-bold text-slate-200 uppercase truncate mt-1">???</div>
        </div>
        <div class="bg-[#131b2e] border border-slate-700/50 rounded-lg p-1.5 shadow-md">
          <div id="q3" class="bg-[#1a243b] px-3 py-1.5 rounded text-xs font-bold text-slate-200 uppercase truncate">???</div>
          <div id="q4" class="bg-[#1a243b] px-3 py-1.5 rounded text-xs font-bold text-slate-200 uppercase truncate mt-1">???</div>
        </div>
        <div class="bg-[#131b2e] border border-slate-700/50 rounded-lg p-1.5 shadow-md">
          <div id="q5" class="bg-[#1a243b] px-3 py-1.5 rounded text-xs font-bold text-slate-200 uppercase truncate">???</div>
          <div id="q6" class="bg-[#1a243b] px-3 py-1.5 rounded text-xs font-bold text-slate-200 uppercase truncate mt-1">???</div>
        </div>
        <div class="bg-[#131b2e] border border-slate-700/50 rounded-lg p-1.5 shadow-md">
          <div id="q7" class="bg-[#1a243b] px-3 py-1.5 rounded text-xs font-bold text-slate-200 uppercase truncate">???</div>
          <div id="q8" class="bg-[#1a243b] px-3 py-1.5 rounded text-xs font-bold text-slate-200 uppercase truncate mt-1">???</div>
        </div>
      </div>

      <!-- SEMIFINALS (2 Matches) -->
      <div class="flex flex-col justify-around h-[680px] w-48">
        <div class="bg-[#131b2e] border border-slate-700/50 rounded-lg p-1.5 shadow-md">
          <div id="sf1" class="bg-[#1a243b] px-3 py-1.5 rounded text-xs font-bold text-slate-200 uppercase truncate">???</div>
          <div id="sf2" class="bg-[#1a243b] px-3 py-1.5 rounded text-xs font-bold text-slate-200 uppercase truncate mt-1">???</div>
        </div>
        <div class="bg-[#131b2e] border border-slate-700/50 rounded-lg p-1.5 shadow-md">
          <div id="sf3" class="bg-[#1a243b] px-3 py-1.5 rounded text-xs font-bold text-slate-200 uppercase truncate">???</div>
          <div id="sf4" class="bg-[#1a243b] px-3 py-1.5 rounded text-xs font-bold text-slate-200 uppercase truncate mt-1">???</div>
        </div>
      </div>

      <!-- FINALS (1 Match) -->
      <div class="flex flex-col justify-center h-[680px] w-48">
        <div class="bg-[#131b2e] border border-slate-700/50 rounded-lg p-1.5 shadow-md">
          <div id="f1" class="bg-[#1a243b] px-3 py-1.5 rounded text-xs font-bold text-slate-200 uppercase truncate">???</div>
          <div id="f2" class="bg-[#1a243b] px-3 py-1.5 rounded text-xs font-bold text-slate-200 uppercase truncate mt-1">???</div>
        </div>
      </div>

      <!-- CHAMPION -->
      <div class="flex flex-col items-center justify-center h-[680px] w-52">
        <div class="text-xs font-black tracking-widest text-amber-500 uppercase mb-3 text-center">CHAMPION</div>
        
        <!-- Glowing Trophy / Crystal Icon Container -->
        <div class="relative flex items-center justify-center mb-3">
          <div class="absolute w-16 h-16 bg-amber-500/20 rounded-full blur-md"></div>
          <div class="relative w-14 h-14 bg-gradient-to-b from-amber-400 to-amber-600 rounded-full flex items-center justify-center border-2 border-amber-300 shadow-lg text-2xl">
            🔮
          </div>
        </div>

        <!-- Champion Slot -->
        <div class="w-full bg-[#131b2e] border-2 border-amber-500 rounded-lg p-1.5 shadow-[0_0_20px_rgba(245,158,11,0.3)]">
          <div id="winner" class="bg-amber-500 text-slate-950 px-3 py-2 rounded text-sm font-black text-center uppercase tracking-wider truncate">
            CHAMPION
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="firebase.js"></script>

  <script>
    db.ref('bracket').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        for (let key in data) {
          const el = document.getElementById(key);
          if (el) el.innerText = data[key] || '???';
        }
      }
    });
  </script>
</body>
</html>
