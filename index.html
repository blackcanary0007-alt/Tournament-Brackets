<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Tournament Bracket</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-6">

  <!-- Header -->
  <header class="text-center my-8">
    <h1 class="text-4xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
      CHAMPIONSHIP BRACKET
    </h1>
    <p class="text-slate-400 mt-2 text-sm">Real-time Tournament Tracking</p>
  </header>

  <!-- Bracket Container -->
  <main class="w-full max-w-5xl flex flex-col md:flex-row justify-center items-center md:items-stretch gap-8 my-auto">
    
    <!-- Semi-Finals -->
    <div class="flex flex-col justify-around gap-6 w-full max-w-xs">
      <h2 class="text-xs font-bold uppercase tracking-widest text-slate-500 text-center">Semi-Finals</h2>
      
      <!-- Match 1 -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 shadow-lg hover:border-slate-700 transition">
        <div id="p1" class="bg-slate-800/80 px-4 py-2.5 rounded-lg mb-2 font-semibold text-slate-200 border border-slate-700/50 flex justify-between items-center">
          <span>Player 1</span>
        </div>
        <div id="p2" class="bg-slate-800/80 px-4 py-2.5 rounded-lg font-semibold text-slate-200 border border-slate-700/50 flex justify-between items-center">
          <span>Player 2</span>
        </div>
      </div>

      <!-- Match 2 -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 shadow-lg hover:border-slate-700 transition">
        <div id="p3" class="bg-slate-800/80 px-4 py-2.5 rounded-lg mb-2 font-semibold text-slate-200 border border-slate-700/50 flex justify-between items-center">
          <span>Player 3</span>
        </div>
        <div id="p4" class="bg-slate-800/80 px-4 py-2.5 rounded-lg font-semibold text-slate-200 border border-slate-700/50 flex justify-between items-center">
          <span>Player 4</span>
        </div>
      </div>
    </div>

    <!-- Finals -->
    <div class="flex flex-col justify-center gap-6 w-full max-w-xs">
      <h2 class="text-xs font-bold uppercase tracking-widest text-slate-500 text-center">Grand Finals</h2>
      
      <div class="bg-slate-900 border border-blue-900/40 rounded-xl p-3 shadow-xl">
        <div id="f1" class="bg-slate-800/80 px-4 py-2.5 rounded-lg mb-2 font-semibold text-slate-200 border border-slate-700/50">
          TBD
        </div>
        <div id="f2" class="bg-slate-800/80 px-4 py-2.5 rounded-lg font-semibold text-slate-200 border border-slate-700/50">
          TBD
        </div>
      </div>
    </div>

    <!-- Champion -->
    <div class="flex flex-col justify-center w-full max-w-xs">
      <h2 class="text-xs font-bold uppercase tracking-widest text-amber-500 text-center mb-6">Champion</h2>
      
      <div class="bg-gradient-to-b from-amber-500/10 to-slate-900 border border-amber-500/30 rounded-xl p-4 text-center shadow-2xl">
        <div class="text-3xl mb-1">🏆</div>
        <div id="winner" class="bg-amber-500 text-slate-950 px-4 py-3 rounded-lg font-black text-lg shadow-lg tracking-wide uppercase">
          TBD
        </div>
      </div>
    </div>

  </main>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="firebase.js"></script>

  <script>
    db.ref('bracket').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        for (let key in data) {
          const el = document.getElementById(key);
          if (el) el.innerText = data[key] || 'TBD';
        }
      }
    });
  </script>
</body>
</html>
