<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Tournament Bracket</title>
  <style>
    body { background: #080f19; color: #fff; font-family: sans-serif; padding: 20px; }
    .prizes-box { border: 1px solid #1e3a5f; border-radius: 8px; padding: 15px; margin-bottom: 20px; background: #0c182b; }
    .prize-row { margin: 8px 0; padding: 8px; background: #132238; border-radius: 4px; display: flex; align-items: center; }
    .gold { border-left: 4px solid #ffd700; }
    .silver { border-left: 4px solid #c0c0c0; }
    .bronze { border-left: 4px solid #cd7f32; }
    .bracket-container { border: 2px solid #00d2ff; border-radius: 8px; padding: 20px; background: #060d17; display: flex; gap: 30px; }
    .column { display: flex; flex-direction: column; justify-content: space-around; min-width: 140px; }
    .slot { background: #18283d; padding: 10px; border-radius: 4px; margin: 5px 0; border: 1px solid #2a456c; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

  <div class="prizes-box">
    <h2>🏆 AMOIBEΣ ΔΙΑΓΩΝΙΣΜΟΎ / TOURNAMENT REWARDS</h2>
    <div class="prize-row gold">🥇 1Η ΘΕΣΗ: 70€ cash</div>
    <div class="prize-row silver">🥈 2Η ΘΕΣΗ: 30€ cash</div>
    <div class="prize-row bronze">🥉 3Η ΘΕΣΗ: 500 Prisms</div>
    <div class="prize-row">🎖️ 4Η ΘΕΣΗ: Δωρεάν συμμετοχή + 100 Prisms</div>
  </div>

  <div class="bracket-container">
    <div class="column" id="round16">
      <h3>ROUND OF 16</h3>
      <!-- 16 player slots dynamically populated -->
    </div>
    <div class="column" id="quarterfinals">
      <h3>QUARTERFINALS</h3>
    </div>
    <div class="column" id="semifinals">
      <h3>SEMIFINAL</h3>
    </div>
    <div class="column" id="finals">
      <h3>FINALS</h3>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      databaseURL: "YOUR_FIREBASE_DATABASE_URL",
      projectId: "YOUR_PROJECT_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    onValue(ref(db, 'bracket/'), (snapshot) => {
      const data = snapshot.val() || {};
      renderBracket(data);
    });

    function renderBracket(data) {
      const col16 = document.getElementById('round16');
      col16.querySelectorAll('.slot').forEach(e => e.remove());
      
      for(let i = 1; i <= 16; i++) {
        const div = document.createElement('div');
        div.className = 'slot';
        div.innerText = data[`p${i}`] || `PLAYER ${i}`;
        col16.appendChild(div);
      }
    }
  </script>
</body>
</html>
