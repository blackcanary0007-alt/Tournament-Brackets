<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournament Bracket</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; text-align: center; }
    h1 { margin-bottom: 30px; }
    .bracket { display: flex; justify-content: center; gap: 40px; margin-top: 20px; }
    .round { display: flex; flex-direction: column; justify-content: space-around; }
    .match { background: #1e1e1e; border: 1px solid #333; padding: 10px; margin: 10px 0; width: 160px; border-radius: 5px; }
    .slot { padding: 5px; background: #2a2a2a; margin: 3px 0; border-radius: 3px; }
  </style>
</head>
<body>

  <h1>Tournament Bracket</h1>
  <div class="bracket">
    <!-- Semi Finals -->
    <div class="round">
      <h3>Semi-Finals</h3>
      <div class="match">
        <div class="slot" id="p1">Player 1</div>
        <div class="slot" id="p2">Player 2</div>
      </div>
      <div class="match">
        <div class="slot" id="p3">Player 3</div>
        <div class="slot" id="p4">Player 4</div>
      </div>
    </div>
    <!-- Finals -->
    <div class="round">
      <h3>Finals</h3>
      <div class="match">
        <div class="slot" id="f1">TBD</div>
        <div class="slot" id="f2">TBD</div>
      </div>
    </div>
    <!-- Winner -->
    <div class="round">
      <h3>Champion</h3>
      <div class="match">
        <div class="slot" id="winner" style="background:#4CAF50; font-weight:bold;">TBD</div>
      </div>
    </div>
  </div>

  <!-- Firebase Web SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  
  <!-- Central Config File -->
  <script src="firebase.js"></script>

  <script>
    // Listen for live database updates
    db.ref('bracket').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        for (let key in data) {
          const el = document.getElementById(key);
          if (el) el.innerText = data[key] || 'TBD';
        }
      }
    });
  </script>
</body>
</html>
