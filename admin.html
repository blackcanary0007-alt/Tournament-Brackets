<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bracket Admin Panel</title>
  <style>
    body { font-family: Arial, sans-serif; background: #181818; color: #fff; padding: 20px; text-align: center; }
    .card { background: #242424; padding: 20px; border-radius: 8px; display: inline-block; text-align: left; margin-top: 20px; }
    input { display: block; width: 250px; padding: 8px; margin: 8px 0; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; }
    button { padding: 8px 16px; background: #008CBA; color: white; border: none; cursor: pointer; border-radius: 4px; margin-top: 5px; }
    button:hover { background: #005f73; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <h1>Admin Control Panel</h1>

  <!-- Login Section -->
  <div id="login-section" class="card">
    <h2>Login</h2>
    <input type="email" id="email" placeholder="Admin Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Sign In</button>
    <p id="error-msg" style="color: red;"></p>
  </div>

  <!-- Bracket Edit Section -->
  <div id="admin-section" class="card hidden">
    <h2>Edit Bracket Slots</h2>
    <label>Player 1:</label><input type="text" id="input-p1">
    <label>Player 2:</label><input type="text" id="input-p2">
    <label>Player 3:</label><input type="text" id="input-p3">
    <label>Player 4:</label><input type="text" id="input-p4">
    <hr>
    <label>Finalist 1:</label><input type="text" id="input-f1">
    <label>Finalist 2:</label><input type="text" id="input-f2">
    <hr>
    <label>Champion:</label><input type="text" id="input-winner">
    <br>
    <button onclick="updateBracket()">Save & Publish Bracket</button>
    <button onclick="logout()" style="background:#f44336;">Logout</button>
  </div>

  <!-- Firebase Web SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <!-- Central Config File -->
  <script src="firebase.js"></script>

  <script>
    // Monitor auth state changes
    auth.onAuthStateChanged((user) => {
      if (user) {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('admin-section').classList.remove('hidden');
        loadCurrentData();
      } else {
        document.getElementById('login-section').classList.remove('hidden');
        document.getElementById('admin-section').classList.add('hidden');
      }
    });

    function login() {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      auth.signInWithEmailAndPassword(email, pass).catch(err => {
        document.getElementById('error-msg').innerText = err.message;
      });
    }

    function logout() {
      auth.signOut();
    }

    function loadCurrentData() {
      db.ref('bracket').once('value', (snapshot) => {
        const data = snapshot.val() || {};
        ['p1', 'p2', 'p3', 'p4', 'f1', 'f2', 'winner'].forEach(key => {
          document.getElementById('input-' + key).value = data[key] || '';
        });
      });
    }

    function updateBracket() {
      const payload = {
        p1: document.getElementById('input-p1').value,
        p2: document.getElementById('input-p2').value,
        p3: document.getElementById('input-p3').value,
        p4: document.getElementById('input-p4').value,
        f1: document.getElementById('input-f1').value,
        f2: document.getElementById('input-f2').value,
        winner: document.getElementById('input-winner').value
      };
      
      db.ref('bracket').set(payload)
        .then(() => alert('Bracket updated live!'))
        .catch(err => alert('Error saving: ' + err.message));
    }
  </script>
</body>
</html>
