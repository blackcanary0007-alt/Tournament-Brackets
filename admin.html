<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bracket Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">

    <!-- Login Card -->
    <div id="login-section" class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-slate-100">Admin Authentication</h1>
        <p class="text-slate-400 text-sm mt-1">Sign in to manage tournament brackets</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Email Address</label>
          <input type="email" id="email" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-blue-500 transition" placeholder="admin@example.com">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Password</label>
          <input type="password" id="password" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-blue-500 transition" placeholder="••••••••">
        </div>

        <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg shadow-lg shadow-blue-600/30 transition duration-200">
          Sign In
        </button>

        <p id="error-msg" class="text-xs text-rose-500 text-center min-h-[1rem]"></p>
      </div>
    </div>

    <!-- Admin Controls Card -->
    <div id="admin-section" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
        <div>
          <h2 class="text-xl font-bold text-slate-100">Dashboard</h2>
          <p class="text-xs text-slate-400">Update bracket progression</p>
        </div>
        <button onclick="logout()" class="bg-slate-800 hover:bg-rose-600/20 hover:text-rose-400 text-slate-400 text-xs font-semibold px-3 py-1.5 rounded-lg border border-slate-700/50 hover:border-rose-500/30 transition">
          Log Out
        </button>
      </div>

      <div class="space-y-4 max-h-[70vh] overflow-y-auto pr-1">
        
        <!-- Semi Finals Section -->
        <div>
          <h3 class="text-xs font-bold uppercase tracking-wider text-blue-400 mb-2">Semi-Finalists</h3>
          <div class="grid grid-cols-2 gap-2">
            <input type="text" id="input-p1" placeholder="P1 Name" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:border-blue-500 focus:outline-none">
            <input type="text" id="input-p2" placeholder="P2 Name" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:border-blue-500 focus:outline-none">
            <input type="text" id="input-p3" placeholder="P3 Name" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:border-blue-500 focus:outline-none">
            <input type="text" id="input-p4" placeholder="P4 Name" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:border-blue-500 focus:outline-none">
          </div>
        </div>

        <!-- Finals Section -->
        <div class="pt-2">
          <h3 class="text-xs font-bold uppercase tracking-wider text-purple-400 mb-2">Finalists</h3>
          <div class="grid grid-cols-2 gap-2">
            <input type="text" id="input-f1" placeholder="Finalist 1" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:border-purple-500 focus:outline-none">
            <input type="text" id="input-f2" placeholder="Finalist 2" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:border-purple-500 focus:outline-none">
          </div>
        </div>

        <!-- Winner Section -->
        <div class="pt-2">
          <h3 class="text-xs font-bold uppercase tracking-wider text-amber-400 mb-2">Winner</h3>
          <input type="text" id="input-winner" placeholder="Champion Name" class="w-full bg-slate-950 border border-amber-500/40 rounded-lg px-3 py-2 text-sm text-amber-300 font-semibold focus:border-amber-400 focus:outline-none">
        </div>

        <button onclick="updateBracket()" class="w-full mt-4 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg shadow-lg shadow-emerald-600/20 transition">
          Publish Changes Live
        </button>

      </div>
    </div>

  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="firebase.js"></script>

  <script>
    auth.onAuthStateChanged((user) => {
      if (user) {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('admin-section').classList.remove('hidden');
        loadCurrentData();
      } else {
        document.getElementById('login-section').classList.remove('hidden');
        document.getElementById('admin-section').classList.add('hidden');
      }
    });

    function login() {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      document.getElementById('error-msg').innerText = '';
      
      auth.signInWithEmailAndPassword(email, pass).catch(err => {
        document.getElementById('error-msg').innerText = err.message;
      });
    }

    function logout() {
      auth.signOut();
    }

    function loadCurrentData() {
      db.ref('bracket').once('value', (snapshot) => {
        const data = snapshot.val() || {};
        ['p1', 'p2', 'p3', 'p4', 'f1', 'f2', 'winner'].forEach(key => {
          document.getElementById('input-' + key).value = data[key] || '';
        });
      });
    }

    function updateBracket() {
      const payload = {
        p1: document.getElementById('input-p1').value,
        p2: document.getElementById('input-p2').value,
        p3: document.getElementById('input-p3').value,
        p4: document.getElementById('input-p4').value,
        f1: document.getElementById('input-f1').value,
        f2: document.getElementById('input-f2').value,
        winner: document.getElementById('input-winner').value
      };
      
      db.ref('bracket').set(payload)
        .then(() => alert('Bracket updated live!'))
        .catch(err => alert('Error saving: ' + err.message));
    }
  </script>
</body>
</html>
